name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 設定 GitHub Pages 部署所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 允許同一時間只有一個部署作業進行，避免衝突
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 設定 Node.js 22 環境
      # 移除強制依賴 lockfile 的快取設定 (不設定 cache: 'npm')
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 使用標準的 npm install，無論是否有 package-lock.json 都能順暢安裝
      - name: Install dependencies
        run: npm install

      # 執行 Vite 正式建置 (輸出到 dist/)
      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 上傳 Vite 建置產出 dist 目錄
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 部署至 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
